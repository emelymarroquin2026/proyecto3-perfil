<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyecto 3 - Pilotos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏎️ Proyecto 3 - Pilotos</h1>
        <p>Evaluación autónoma - Trabajo colaborativo</p>
    </header>

    <main>

        <!-- SECCIÓN DE ESTADÍSTICAS -->

        <section class="estadisticas">

            <h2>Estadísticas de la carrera</h2>

            <button id="btn-estadisticas">
                Mostrar estadísticas
            </button>

            <div id="estadisticas">
                <!-- Aquí aparecerán las estadísticas -->
            </div>

        </section>


        <!-- SECCIÓN DE PILOTOS -->

        <section class="pilotos">

            <h2>Pilotos</h2>

            <div class="contenedor-pilotos">

                <div class="card-piloto">

                    <h2 id="nombre">
                        Piloto 1
                    </h2>

                    <p>
                        <strong>Equipo:</strong> Equipo Azul
                    </p>

                    <p>
                        <strong>Número:</strong> #10
                    </p>

                </div>


                <div class="card-piloto">

                    <h2 id="nombre-companero">
                        Piloto 2
                    </h2>

                    <p>
                        <strong>Equipo:</strong> Equipo Rojo
                    </p>

                    <p>
                        <strong>Número:</strong> #18
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>Proyecto 3 - Git y GitHub</p>
    </footer>


    <script src="app.js"></script>

</body>
</html>
